<rect class="hx" x="572" y="100" width="10" height="10" rx="2"/>
<rect class="hx" x="585" y="100" width="10" height="10" rx="2"/>
<text class="xs" x="545" y="92" text-anchor="middle">merged sketch (filtered)</text>
<text class="xs" x="338" y="214">d = 1 − avg(sample in cluster, cluster in sample)</text>
<text class="m" x="338" y="233">d = 1 − avg(5/5, 5/5) = 0.00 &lt; 0.1 → joins cluster</text>
