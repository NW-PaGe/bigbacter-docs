</g>
<line class="line" x1="444" y1="105" x2="487" y2="105"/>
<text class="xs" x="465" y="123" text-anchor="middle">≥ 60%</text>
<rect class="hc" x="494" y="100" width="10" height="10" rx="2"/>
<rect class="hc" x="507" y="100" width="10" height="10" rx="2"/>
<rect class="hc" x="520" y="100" width="10" height="10" rx="2"/>
<rect class="hc" x="533" y="100" width="10" height="10" rx="2"/>
<rect class="hc" x="546" y="100" width="10" height="10" rx="2"/>
