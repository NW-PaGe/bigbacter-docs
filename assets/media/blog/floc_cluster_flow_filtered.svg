<text class="xs" x="333" y="124" text-anchor="end">3</text>
<text class="xs" x="388" y="146" text-anchor="middle">cluster members</text>
<line class="cmp" x1="545" y1="116" x2="545" y2="155"/>
<rect class="hn" x="494" y="162" width="10" height="10" rx="2"/>
<rect class="hn" x="507" y="162" width="10" height="10" rx="2"/>
