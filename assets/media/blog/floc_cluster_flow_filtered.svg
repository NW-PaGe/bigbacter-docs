<line class="line" x1="640" y1="110" x2="683" y2="110"/>
<rect class="out" x="685" y="85" width="125" height="50" rx="6"/><text class="h" x="747" y="108" text-anchor="middle">Join existing</text><text class="h" x="747" y="126" text-anchor="middle">cluster</text>
<line class="line" x1="480" y1="260" x2="480" y2="303"/><text class="lbl" x="488" y="286">Unassigned</text>
<rect class="main" x="320" y="305" width="320" height="180" rx="6"/>
<text class="h" x="480" y="330" text-anchor="middle">DBSCAN</text>
<text class="s" x="480" y="348" text-anchor="middle">every sample vs. every other sample</text>
<line class="edge" x1="480.0" y1="370.0" x2="522.8" y2="401.1"/>
