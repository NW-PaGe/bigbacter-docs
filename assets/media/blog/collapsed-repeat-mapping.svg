<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Reads from a repeated region forced onto a single copy in the reference</title>
  <desc id="desc">The sample genome contains two slightly different copies of a repeated region. The de novo assembly used as the reference collapses them into a single copy. When reads are mapped back, reads from both copies pile onto that one region, and the bases that differ between the copies are called as SNPs even though the sample is being compared with itself.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
  </defs>

  <rect x="0" y="0" width="780" height="440" rx="12" fill="#ffffff"/>

  <!-- ===== 1. True genome ===== -->
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">1. The sample's genome</text>
  <text x="210" y="34" font-size="13" fill="#475569">has two slightly different copies of a repeated region</text>

  <!-- reads from copy 1 -->
  <g fill="#2563eb">
    <rect x="164" y="56" width="70" height="7" rx="3"/>
    <rect x="244" y="56" width="70" height="7" rx="3"/>
    <rect x="200" y="68" width="70" height="7" rx="3"/>
  </g>
  <!-- reads from copy 2 (with differing bases) -->
  <g fill="#9333ea">
    <rect x="464" y="56" width="70" height="7" rx="3"/>
    <rect x="544" y="56" width="70" height="7" rx="3"/>
    <rect x="500" y="68" width="70" height="7" rx="3"/>
  </g>
  <g stroke="#ea580c" stroke-width="3">
    <line x1="500" y1="54" x2="500" y2="65"/>
    <line x1="550" y1="54" x2="550" y2="65"/>
    <line x1="590" y1="54" x2="590" y2="65"/>
    <line x1="550" y1="66" x2="550" y2="77"/>
  </g>

  <!-- genome bar -->
  <rect x="40" y="86" width="700" height="16" rx="4" fill="#cbd5e1"/>
  <rect x="160" y="86" width="160" height="16" fill="#2563eb"/>
  <rect x="460" y="86" width="160" height="16" fill="#9333ea"/>
  <g stroke="#ea580c" stroke-width="3">
    <line x1="500" y1="84" x2="500" y2="104"/>
    <line x1="550" y1="84" x2="550" y2="104"/>
    <line x1="590" y1="84" x2="590" y2="104"/>
  </g>
  <text x="240" y="122" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">Copy 1</text>
  <text x="540" y="122" font-size="13" font-weight="700" fill="#9333ea" text-anchor="middle">Copy 2</text>

  <!-- arrows into the pileup -->
  <path d="M240,130 C240,165 330,165 345,192" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <path d="M540,130 C540,165 450,165 435,192" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ap)"/>
  <text x="390" y="160" font-size="12" fill="#475569" text-anchor="middle">all reads map to the same place</text>

  <!-- ===== 2. Reference and pileup ===== -->
  <text x="24" y="222" font-size="15" font-weight="700" fill="#0f172a">2. Reads mapped back</text>
  <text x="24" y="240" font-size="13" fill="#475569">to the sample's own</text>
  <text x="24" y="256" font-size="13" fill="#475569">assembly (the reference)</text>

  <!-- pileup over collapsed region x 310-470; differing sites at 350, 400, 440 -->
  <g fill="#2563eb">
    <rect x="312" y="200" width="70" height="7" rx="3"/>
    <rect x="392" y="200" width="70" height="7" rx="3"/>
    <rect x="348" y="224" width="70" height="7" rx="3"/>
  </g>
  <g fill="#9333ea">
    <rect x="314" y="212" width="70" height="7" rx="3"/>
    <rect x="394" y="212" width="70" height="7" rx="3"/>
    <rect x="350" y="236" width="70" height="7" rx="3"/>
  </g>
  <g stroke="#ea580c" stroke-width="3">
    <line x1="350" y1="210" x2="350" y2="221"/>
    <line x1="400" y1="210" x2="400" y2="221"/>
    <line x1="440" y1="210" x2="440" y2="221"/>
    <line x1="400" y1="234" x2="400" y2="245"/>
  </g>

  <!-- reference bar: repeat collapsed to one copy -->
  <rect x="200" y="254" width="380" height="16" rx="4" fill="#cbd5e1"/>
  <rect x="310" y="254" width="160" height="16" fill="#2563eb"/>
  <text x="390" y="288" font-size="12" fill="#334155" text-anchor="middle">only one copy of the repeat in the assembly</text>

  <!-- ===== 3. SNPs called ===== -->
  <text x="24" y="330" font-size="15" font-weight="700" fill="#0f172a">3. Result</text>
  <g fill="#ea580c">
    <path d="M343,304 L357,304 L350,316 z"/>
    <path d="M393,304 L407,304 L400,316 z"/>
    <path d="M433,304 L447,304 L440,316 z"/>
  </g>
  <text x="390" y="336" font-size="14" font-weight="700" fill="#ea580c" text-anchor="middle">Apparent SNPs</text>
  <text x="390" y="354" font-size="13" fill="#334155" text-anchor="middle">Copy 2 reads disagree with the reference, even though the sample is compared with itself</text>

  <!-- legend -->
  <line x1="24" y1="384" x2="756" y2="384" stroke="#e2e8f0"/>
  <rect x="60" y="404" width="30" height="7" rx="3" fill="#2563eb"/>
  <text x="98" y="412" font-size="12" fill="#334155">read from Copy 1</text>
  <rect x="240" y="404" width="30" height="7" rx="3" fill="#9333ea"/>
  <text x="278" y="412" font-size="12" fill="#334155">read from Copy 2</text>
  <line x1="430" y1="401" x2="430" y2="414" stroke="#ea580c" stroke-width="3"/>
  <text x="442" y="412" font-size="12" fill="#334155">base that differs between the copies</text>
</svg>
