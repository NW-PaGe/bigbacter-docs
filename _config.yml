title: BigBacter Docs
description: Documentation for the BigBacter pipeline
theme: just-the-docs

url: https://github.com/nw-page/bigbacter-docs

baseurl: "/bigbacter-docs"

favicon_ico: "/assets/media/bigbacter_logo.ico"

aux_links:
  BigBacter GitHub: https://github.com/nw-page/bigbacter

# Blog posts live in `_blog/` and get their own "Posts" section in the
# sidebar, below the version docs. See `_blog/index.md` for how to add one.
collections:
  blog:
    permalink: "/posts/:path/"
    output: true

just_the_docs:
  collections:
    blog:
      name: Posts
      nav_fold: false

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: red
  example:
    title: Example
    color: yellow
